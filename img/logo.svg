<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="Danielle Nail Designer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb8"/>
      <stop offset="1" stop-color="#e8457d"/>
    </linearGradient>
  </defs>

  <!-- Monograma -->
  <g transform="translate(36 36)">
    <circle r="31" fill="none" stroke="url(#g)" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="1"/>
    <text x="-1" y="13" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="46" fill="currentColor">D</text>
    <!-- gota de esmalte -->
    <path d="M22 14c0 4.5 5 7.5 5 12a5 5 0 0 1-10 0c0-4.5 5-7.5 5-12z" fill="url(#g)"/>
  </g>

  <!-- Nome -->
  <text x="84" y="40" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="600" font-size="40" letter-spacing="-.5" fill="currentColor">Danielle</text>
  <text x="86" y="60" font-family="'DM Sans', system-ui, Arial, sans-serif" font-weight="600" font-size="10.5" letter-spacing="4.2" fill="#e8457d">NAIL DESIGNER</text>
</svg>
